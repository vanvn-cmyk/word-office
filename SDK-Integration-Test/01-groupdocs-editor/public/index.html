<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Document Editor Test</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #F7F4EF; color: #1A1814; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  button { height: 40px; padding: 0 16px; border-radius: 8px; border: none; background: #C4603A; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.secondary { background: #fff; color: #C4603A; border: 1px solid #C4603A; }
  #status { font-size: 13px; color: #6B6560; white-space: pre-wrap; margin-bottom: 16px; max-height: 160px; overflow: auto; background: #fff; border: 1px solid #E2DDD6; border-radius: 8px; padding: 8px 12px; }
  #editorFrame { width: 100%; height: 70vh; border: 1px solid #E2DDD6; border-radius: 8px; background: #fff; }
  .hint { font-size: 12px; color: #6B6560; margin-top: 4px; }
  #errorBox { background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  #errorBox .error-title { color: #DC2626; font-weight: 600; margin-bottom: 4px; }
  #errorBox .error-safe { font-size: 12px; color: #6B6560; margin-top: 6px; }
  #errorBox details { margin-top: 8px; font-size: 12px; }
  #errorBox summary { cursor: pointer; color: #6B6560; }
  #errorBox pre { white-space: pre-wrap; background: #fff; border: 1px solid #E2DDD6; border-radius: 6px; padding: 8px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Document Editor Test</h1>
  <div class="toolbar">
    <input type="file" id="fileInput" accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.rtx,.csv" />
    <button id="loadBtn">Open & Edit</button>
    <button id="saveBtn" class="secondary" disabled>Save & Download</button>
  </div>
  <div class="hint">Pick a Word, Excel, or PowerPoint file — ideally one with tables, charts, or animations — to see how well it survives editing.</div>
  <div id="errorBox" hidden></div>
  <div id="status"></div>
  <iframe id="editorFrame"></iframe>

  <script>
    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusEl = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');
    const frame = document.getElementById('editorFrame');

    let session = null;

    function log(msg) {
      statusEl.textContent += msg + '\n';
      statusEl.scrollTop = statusEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showError(errorText, detailText) {
      errorBox.hidden = false;
      errorBox.innerHTML = `
        <div class="error-title">${escapeHtml(errorText)}</div>
        <div class="error-safe">Your original file on this device was not changed or lost — all processing happens on a temporary copy in the cloud.</div>
        ${detailText ? `<details><summary>Technical details</summary><pre>${escapeHtml(detailText)}</pre></details>` : ''}
      `;
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.innerHTML = '';
    }

    loadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { log('Please choose a file first.'); return; }

      loadBtn.disabled = true;
      saveBtn.disabled = true;
      statusEl.textContent = '';
      clearError();
      log(`Uploading and converting "${file.name}"...`);

      try {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('/api/load', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Something went wrong.', data.detail);
          return;
        }

        session = data;
        log('Loaded successfully. Opening in the editor...');

        const baseTag = `<base id="gdocs-test-base" href="${window.location.origin}${data.resourceBase}">`;
        let html = data.html;
        html = html.includes('<head>') ? html.replace('<head>', `<head>${baseTag}`) : baseTag + html;

        frame.srcdoc = html;
        frame.onload = () => {
          try {
            frame.contentDocument.designMode = 'on';
            log('Ready to edit — click anywhere in the document to make changes.');
          } catch (e) {
            log("Couldn't enable editing: " + e.message);
          }
        };
        saveBtn.disabled = false;
      } catch (err) {
        showError('A connection or browser-side error occurred.', err.message);
      } finally {
        loadBtn.disabled = false;
      }
    });

    saveBtn.addEventListener('click', async () => {
      if (!session) return;
      saveBtn.disabled = true;
      clearError();
      log('Saving your changes and converting back to the original format...');

      try {
        const doc = frame.contentDocument;
        const baseEl = doc.getElementById('gdocs-test-base');
        if (baseEl) baseEl.remove();
        const html = doc.documentElement.outerHTML;

        const res = await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ html, ...session })
        });

        if (!res.ok) {
          const data = await res.json();
          showError(data.error || 'Something went wrong.', data.detail);
          return;
        }

        const blob = await res.blob();
        const disposition = res.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="(.+)"/);
        const filename = match ? match[1] : 'edited-output';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        log(`Done — downloaded "${filename}". Open it to check how well the formatting was preserved.`);
      } catch (err) {
        showError('A connection or browser-side error occurred.', err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
