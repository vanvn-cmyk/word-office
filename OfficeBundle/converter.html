<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
// Headless converter page — loaded by X2tConverterService in a hidden WKWebView.
// Imports X2tConverter from the bundled sdk-core, initializes x2t.wasm,
// then exposes window.x2tConvert() callable from Swift via evaluateJavaScript.
import { X2tConverter } from 'office://host/sdk-core/index.mjs';

const converter = new X2tConverter('office://host/x2t');

// Safe base64 encode for any size Uint8Array — avoids stack overflow from spread.
function uint8ToBase64(u8) {
    let s = '';
    const chunk = 32768;
    for (let i = 0; i < u8.length; i += chunk) {
        s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(s);
}

async function init() {
    try {
        await converter.init();
        window.webkit.messageHandlers.editorBridge.postMessage({ action: 'converterReady' });
    } catch (e) {
        window.webkit.messageHandlers.editorBridge.postMessage({
            action: 'converterError',
            error: e.message || 'x2t init failed'
        });
    }
}

// Called by Swift: docUrl = office://host/doc/<uuid>.ext served by OfficeSchemeHandler
window.x2tConvert = async function(docUrl, formatFrom, fileName) {
    try {
        const resp = await fetch(docUrl);
        if (!resp.ok) throw new Error('Fetch ' + resp.status + ': ' + docUrl);
        const buffer = await resp.arrayBuffer();

        // Replace extension with .pdf for output filename
        const outName = fileName.replace(/\.[^.]+$/, '.pdf');

        const result = await converter.convert({
            data: buffer,
            fileFrom: fileName,
            fileTo: outName,
            formatFrom: formatFrom,
            formatTo: 513   // AVS_FILE_CROSSPLATFORM_PDF
        });

        if (result && result.output && result.output.length > 0) {
            window.webkit.messageHandlers.editorBridge.postMessage({
                action: 'convertResult',
                success: true,
                base64pdf: uint8ToBase64(result.output)
            });
        } else {
            window.webkit.messageHandlers.editorBridge.postMessage({
                action: 'convertResult',
                success: false,
                error: 'x2t returned empty output (unsupported format or corrupt file)'
            });
        }
    } catch (e) {
        window.webkit.messageHandlers.editorBridge.postMessage({
            action: 'convertResult',
            success: false,
            error: e.message || 'Conversion error'
        });
    }
};

init();
</script>
</body>
</html>
