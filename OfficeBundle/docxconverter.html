<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=595">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { background: white; }
body {
    margin: 0;
    padding: 54px 72px;
    width: 595px;
    font-family: 'Times New Roman', Times, serif;
    font-size: 12pt;
    line-height: 1.5;
    color: #000;
    background: #fff;
    word-wrap: break-word;
    overflow-wrap: break-word;
}
h1 { font-size: 20pt; font-weight: bold; margin: 14pt 0 6pt; }
h2 { font-size: 16pt; font-weight: bold; margin: 12pt 0 4pt; }
h3 { font-size: 13pt; font-weight: bold; margin: 10pt 0 4pt; }
h4, h5, h6 { font-size: 12pt; font-weight: bold; margin: 8pt 0 4pt; }
p { margin: 0 0 6pt; }
a { color: #1155CC; }
table { border-collapse: collapse; width: 100%; margin: 8pt 0; }
td, th { border: 1px solid #999; padding: 4px 8px; font-size: 10pt; vertical-align: top; }
th { font-weight: bold; background: #f4f4f4; }
ul, ol { margin: 0 0 6pt; padding-left: 24pt; }
li { margin-bottom: 2pt; }
blockquote { margin: 8pt 0 8pt 24pt; padding-left: 12pt; border-left: 3px solid #ccc; color: #444; }
img { max-width: 100%; height: auto; }
strong, b { font-weight: bold; }
em, i { font-style: italic; }
u { text-decoration: underline; }
s, del, strike { text-decoration: line-through; }
pre, code { font-family: 'Courier New', monospace; font-size: 10pt; }
pre { background: #f5f5f5; padding: 8pt; border-radius: 4pt; white-space: pre-wrap; }
hr { border: none; border-top: 1px solid #ccc; margin: 12pt 0; }
</style>
</head>
<body>
<script src="office://host/mammoth.min.js"></script>
<script>
window.convertDocx = async function(docUrl) {
    try {
        const resp = await fetch(docUrl);
        if (!resp.ok) throw new Error('Fetch failed: HTTP ' + resp.status);
        const buf = await resp.arrayBuffer();
        const result = await mammoth.convertToHtml({ arrayBuffer: buf });
        document.body.innerHTML = result.value || '<p>(Empty document)</p>';
        // Two rAF passes ensure layout and paint are complete before PDF capture.
        requestAnimationFrame(() => requestAnimationFrame(() => {
            window.webkit.messageHandlers.editorBridge.postMessage({ action: 'htmlReady' });
        }));
    } catch(e) {
        window.webkit.messageHandlers.editorBridge.postMessage({ action: 'htmlError', error: String(e) });
    }
};
// Signal Swift that mammoth.js is loaded and the page is ready.
window.webkit.messageHandlers.editorBridge.postMessage({ action: 'mammothReady' });
</script>
</body>
</html>
