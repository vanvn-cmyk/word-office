<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
  <title>Office Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #placeholder { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #f0f0f0; z-index: 9999;
      gap: 16px; font-family: -apple-system, sans-serif; color: #666;
    }
    #loading-hint {
      font-size: 11px; color: #aaa; text-align: center; max-width: 240px;
      line-height: 1.5; opacity: 0; transition: opacity 0.6s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: #007AFF; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">Opening document…</span>
    <span id="loading-hint">First launch requires internet to load editor components</span>
  </div>
  <div id="placeholder" style="width:100%;height:100%;display:none"></div>

  <script>
  // Dynamic import avoids WKWebView limitations with static ES module imports
  // from custom URL scheme handlers. import() is a runtime call and works where
  // <script type="module"> static imports silently fail.
  (async function () {
    let sdkCore;
    try {
      sdkCore = await import('office://host/sdk-core/index.mjs');
    } catch (importErr) {
      const msg = 'Failed to load editor engine: ' + String(importErr);
      document.getElementById('loading-text').textContent = 'Editor engine failed to load.';
      try {
        window.webkit.messageHandlers.editorBridge.postMessage({ action: 'editorError', message: msg });
      } catch (_) {}
      return;
    }
    const { EditorServer, MockSocket, io, createXHRProxy, getDocumentType } = sdkCore;

    // ── Base64 → ArrayBuffer (chunked to avoid call-stack overflow) ────────────
    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // ── ArrayBuffer → Base64 (chunked to avoid call-stack overflow) ───────────
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const CHUNK = 32768;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.slice(i, i + CHUNK));
      }
      return btoa(binary);
    }

    // ── Intercept download anchor clicks to route to Swift bridge ─────────────
    // EditorServer calls a.click() with a blob: href when saving.
    // WKWebView can't download files, so we intercept and bridge to Swift.
    const pendingBlobCaptures = new Set();
    const _origRevoke = URL.revokeObjectURL.bind(URL);
    URL.revokeObjectURL = function (url) {
      if (!pendingBlobCaptures.has(url)) _origRevoke(url);
    };
    const _origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download && this.href.startsWith('blob:')) {
        const blobUrl = this.href;
        const filename = this.download;
        pendingBlobCaptures.add(blobUrl);
        fetch(blobUrl)
          .then(r => r.arrayBuffer())
          .then(buf => {
            pendingBlobCaptures.delete(blobUrl);
            _origRevoke(blobUrl);
            const b64 = arrayBufferToBase64(buf);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'save',
              fileName: filename,
              base64data: b64,
            });
          })
          .catch(err => {
            pendingBlobCaptures.delete(blobUrl);
            console.error('[editor] save intercept failed:', err);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'saveError',
              message: String(err),
            });
          });
        return; // do NOT call _origClick
      }
      return _origClick.call(this);
    };

    // ── State ──────────────────────────────────────────────────────────────────
    const X2T_PATH = 'office://host/x2t';
    const API_URL  = 'office://host/web-apps/apps/api/documents/api.js';
    const USER     = { id: 'local-user', name: 'User' };

    let server = null;
    let docEditor = null;
    let pendingFilePayload = null; // set by receiveFileFromIOS before editor loads
    let _innerWin = null;          // inner iframe contentWindow, saved in onAppReady()
    let _currentDocType = null;    // "word" | "cell" | "slide" — set in createEditor()
    let _userZoomOverride = false; // true after user manually zooms PPT — suppresses further zoomFitToPage calls

    // Show the "requires internet" hint after 5 s if the editor hasn't become
    // ready yet — the CDN sdkjs download is what takes time on first launch.
    let hintTimer = null;
    function scheduleLoadingHint() {
      hintTimer = setTimeout(() => {
        const el = document.getElementById('loading-hint');
        if (el) el.style.opacity = '1';
      }, 5000);
    }
    function cancelLoadingHint() {
      clearTimeout(hintTimer);
      const el = document.getElementById('loading-hint');
      if (el) el.style.opacity = '0';
    }

    // ── Slide position reporter (PPT only) ────────────────────────────────────
    // Posts { action:'slideChange', current:N, total:M } to Swift.
    // Called after every slide-nav command and wired to asc_onCurrentSlideChanged.
    function _reportSlidePos() {
      if (_currentDocType !== 'slide') return;
      try {
        var _ed = _innerWin && _innerWin.Asc && _innerWin.Asc.editor;
        if (!_ed) return;
        var _cur = 1, _tot = 1;
        // current slide (0-based internally → +1). Try every known OO 9.x API name.
        if      (typeof _ed.asc_getCurrentSlide         === 'function') _cur = (_ed.asc_getCurrentSlide()         || 0) + 1;
        else if (typeof _ed.asc_getCurrentPage          === 'function') _cur = (_ed.asc_getCurrentPage()          || 0) + 1;
        else if (typeof _ed.asc_getCurrentPageIndex     === 'function') _cur = (_ed.asc_getCurrentPageIndex()     || 0) + 1;
        else if (typeof _ed.getCurrentPageIndex         === 'function') _cur = (_ed.getCurrentPageIndex()         || 0) + 1;
        else if (typeof _ed.getCurrentPage              === 'function') _cur = (_ed.getCurrentPage()              || 0) + 1;
        // total slides — do NOT use || 1 fallback: 0 is valid (all slides deleted)
        if      (typeof _ed.asc_getSlidesCount          === 'function') _tot = _ed.asc_getSlidesCount()          || 0;
        else if (typeof _ed.asc_getSlideCount           === 'function') _tot = _ed.asc_getSlideCount()           || 0;
        else if (typeof _ed.asc_getCountPages           === 'function') _tot = _ed.asc_getCountPages()           || 0;
        else if (typeof _ed.asc_getPagesCount           === 'function') _tot = _ed.asc_getPagesCount()           || 0;
        else if (typeof _ed.getCountPages               === 'function') _tot = _ed.getCountPages()               || 0;
        else if (typeof _ed.getSlideCount               === 'function') _tot = _ed.getSlideCount()               || 0;
        else if (typeof _ed.getPresentationInfo         === 'function') { try { _tot = (_ed.getPresentationInfo() || {}).slides || 0; } catch(_) {} }
        // DOM fallback was removed: it counted OO's stale thumbnail DOM elements
        // after slide deletion, causing the toolbar to show incorrect totals.
        // The API return value (including 0) is trusted directly.
        // Sanity-clamp: asc_getCurrentSlide() can return a stale index briefly after
        // delete/add (race between slide model update and callback). Clamp to valid range.
        if (_tot > 0 && _cur > _tot) _cur = _tot;
        if (_cur < 1) _cur = 1;
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'slideChange', current: _cur, total: _tot
        });
        // Capture thumbnail for current slide so the strip updates immediately
        // (ooUIScript's periodic reportSlides() only fires at 3s/6s/10s from load).
        var _thumbSlide = _cur;
        setTimeout(function() { _captureSlideThumb(_thumbSlide); }, 60);
      } catch(_e) {}
    }

    // Captures OO's slide render canvas and sends thumbnail to Swift for the strip.
    // Mirrors captureThumb() in ooUIScript but runs from editor.html (has _innerWin directly).
    function _captureSlideThumb(slideNum) {
      try {
        var _td = _innerWin && _innerWin.document;
        if (!_td) return;
        var _biggest = null, _bigArea = 0;
        _td.querySelectorAll('canvas').forEach(function(c) {
          var w = c.width || c.offsetWidth || 0, h = c.height || c.offsetHeight || 0;
          var area = w * h;
          if (area > _bigArea && w > 100 && h > 60) { _bigArea = area; _biggest = c; }
        });
        if (!_biggest) return;
        var _out = document.createElement('canvas');
        _out.width = 192; _out.height = 108;
        var _ctx = _out.getContext('2d');
        if (!_ctx) return;
        _ctx.drawImage(_biggest, 0, 0, _biggest.width, _biggest.height, 0, 0, 192, 108);
        var _b64 = _out.toDataURL('image/jpeg', 0.6).split(',')[1];
        if (!_b64) return;
        window.webkit.messageHandlers.editorBridge.postMessage(
          { action: 'slideThumbnail', slideNum: slideNum, data: _b64 }
        );
      } catch(_) {}
    }

    // ── Word page position reporter ───────────────────────────────────────────
    // Posts { action:'wordPageChange', current:N, total:M } to Swift.
    // Called via asc_onCurrentPage / asc_onCountPages callbacks and page-nav commands.
    var _wordCurrentPage = 1;
    var _wordTotalPages  = 1;
    function _reportWordPagePos() {
      if (_currentDocType !== 'word') return;
      try {
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'wordPageChange', current: _wordCurrentPage, total: _wordTotalPages
        });
      } catch(_e) {}
    }

    // ── Initialize EditorServer ────────────────────────────────────────────────
    function initServer() {
      server = new EditorServer({ x2tPath: X2T_PATH, user: USER });
      MockSocket.on('connect', ({ socket }) => server.handleConnect({ socket }));
      MockSocket.on('disconnect', ({ socket }) => server.handleDisconnect({ socket }));
    }

    // ── Create DocsAPI.DocEditor ───────────────────────────────────────────────
    function createEditor() {
      const doc = server.getDocument();
      const documentType = getDocumentType(doc.fileType);
      _currentDocType = documentType;

      docEditor = new window.DocsAPI.DocEditor('placeholder', {
        isLocalFile: true,
        document: {
          fileType: doc.fileType,
          key: doc.key,
          title: doc.title,
          url: doc.url,
          permissions: {
            edit: doc.fileType !== 'pdf',
            chat: false,
            rename: false,
            review: false,
            print: true,
            copy: true,
            fillForms: false,
            modifyFilter: true,
            protect: true,
            download: false,
            rightMenu: false,
          },
        },
        documentType,
        editorConfig: {
          lang: navigator.language || 'en',
          coEditing: { mode: 'fast', change: false },
          user: { ...USER },
          customization: {
            uiTheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'theme-dark' : 'theme-light',
            zoom: 100,
            ...(documentType === 'word' ? { hideRulers: true } : {}),
            features: { spellcheck: { change: false } },
            toolbar: { turnOffHeaderFooter: false },
            compactHeader: true,
            compactToolbar: true,   // collapse 2-row ribbon → single icon row
            toolbarHideFileName: true,
            close: { visible: false },
            about: false,
            chat: false,
            comments: false,
            hideRightMenu: true,
            featuresTips: false,
            macrosMode: 'disable',
            // PPT: hide left slide-thumbnail panel + bottom notes panel via OO's
            // documented config options (verified in api.js bundled in OfficeBundle).
            //   layout.leftMenu.mode: false  → start with left panel hidden (slide thumbnails)
            //   hideNotes: true              → hide notes panel on first load (PPT-only option)
            // These are declarative init-time options — OO applies them before any rendering,
            // so they cannot conflict with zoom/canvas and cannot be timed incorrectly.
            ...(documentType === 'slide' ? {
              layout: {
                leftMenu: false,   // completely disables left panel (thumbnails) in PPT
              },
              hideNotes: true,     // hide notes bar on first load (PPT-only option)
            } : {}),
          },
        },
        events: {
          onAppReady: onAppReady,
          onDocumentReady: () => {
            // OO has fully loaded the document — safe to call ShowThumbnails(false) now.
            // DO NOT call this earlier (e.g. from getCountPages polling): calling it
            // during the 52% render phase changes panel display mid-render → freeze.
            if (_currentDocType === 'slide') {
              try {
                var _ed = _innerWin && _innerWin.Asc && _innerWin.Asc.editor;
                if (_ed) {
                  if (typeof _ed.ShowThumbnails  === 'function') { _ed.ShowThumbnails(false); }
                  if (typeof _ed.asc_ShowNotes   === 'function') { _ed.asc_ShowNotes(false); }
                }
              } catch(_) {}
            }
            _reportSlidePos();
          },
          onDocumentStateChange: (e) => {
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'documentStateChange',
              isDirty: e.data,
            });
          },
          onError: (e) => {
            const d = e && e.data;
            const msg = typeof d === 'string' ? d
                      : (d && (d.errorDescription || d.message || JSON.stringify(d)))
                      || 'Unknown editor error';
            console.error('[editor] onError:', msg, e);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'editorError',
              message: msg,
            });
          },
          onSaveDocument: () => {
            window.webkit.messageHandlers.editorBridge.postMessage({ action: 'saved' });
          },
        },
        width: '100%',
        height: '100%',
      });
    }

    // CSS injected into the inner iframe (frameEditor) to strip ONLYOFFICE chrome.
    // Selectors verified against ONLYOFFICE v9.3.x app.css from CDN bundle.
    const OO_IOS_CSS = [
      // ── Header bar: ONLYOFFICE logo + File/Home/Insert tab row ───────────────
      // Hidden because the iOS nav bar (title + Done button) replaces it.
      '#header-row,#header-logo',
      '{display:none!important;height:0!important;min-height:0!important;overflow:hidden!important}',
      // ── Info / coauthors button (top-right in spreadsheet view) ─────────────
      '#id-btn-coauthors,#btn-coauthors,#btn-info,#id-btn-info,.btn-header-info,',
      '#id-spreadsheet-info,.icon-info-container,.asc-info-icon,.coauthors-btn,.btn-icon-info',
      '{display:none!important}',
      // ── Scrollbar chrome (not usable on touch; scrolling handled by WKWebView) ─
      '#ws-v-scrollbar,#ws-h-scrollbar,#ws-scrollbar-corner',
      '{display:none!important}',
      '::-webkit-scrollbar{width:0!important;height:0!important}',
      // ── Left sidebar icon strip (hidden via CSS on first paint) ──────────────
      // display:none + width/min-width:0 collapses both the icons AND the space.
      '#leftmenu,#id-sidebar,#id-toolbar-left,#spreadsheetLeftPanel,',
      '.leftmenu,.asc-leftmenu,.asc-plugin-panel,.asc-leftmenu-item,',
      '[id*="leftmenu"],[class*="leftmenu"],',
      '[id*="left-panel"],[class*="left-panel"],',
      '[id*="leftpanel"],[class*="leftpanel"]',
      '{display:none!important;width:0!important;min-width:0!important;overflow:hidden!important}',
      // ── Right-panel insert icon strip ────────────────────────────────────────
      // The vertical strip of icons on the right edge (Insert table/chart/shape/
      // image/¶/text) is replaced by the native iOS Insert tab in the toolbar.
      '#right-panel,#rightpanel,#right-menu,#rightmenu,',
      '#id-right-panel,#id-rightmenu,',
      '.right-panel,.rightpanel,.asc-rightmenu,',
      '[id*="right-panel"],[id*="rightpanel"],[id*="rightmenu"],',
      '[class*="right-panel"],[class*="rightpanel"]',
      '{display:none!important}',
      // ── OO ribbon toolbar: visually removed, still JS-accessible ────────────
      // Off-screen instead of display:none so _clickOOBtn() can still .click()
      // toolbar buttons as fallback for formula insertion and other commands.
      '#toolbar,#id-toolbar,#toolbar-reflow,.toolbar-reflow,',
      '[id="toolbar"],[id="id-toolbar"],',
      '.toolbar-main,#toolbar-main,.document-toolbar,#document-toolbar',
      `{
        position:absolute!important;
        top:-9999px!important;
        left:-9999px!important;
        width:1px!important;
        height:1px!important;
        overflow:hidden!important;
        opacity:0!important;
        pointer-events:none!important;
        clip:rect(0,0,0,0)!important;
      }`,

      // ── Formula bar: iOS-native styling ──────────────────────────────────────
      `
      /* Outer container */
      #cell-editing-box, .cell-editing-box, #formula-bar, .formula-bar,
      [id*="formula-bar"], [class*="formula-bar"] {
        border-top: none !important;
        border-bottom: 0.5px solid rgba(128,128,128,0.25) !important;
        background: transparent !important;
        padding: 0 8px !important;
        min-height: 36px !important;
        max-height: 36px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
      }
      /* Hide all formula bar children except the last (formula content area).
         Uses :not(:last-child) so it works regardless of OO's actual class names.
         The last child is always the editable formula text area. */
      #cell-editing-box > *:not(:last-child),
      .cell-editing-box > *:not(:last-child),
      #formula-bar > *:not(:last-child),
      .formula-bar > *:not(:last-child),
      [id*="formula-bar"] > *:not(:last-child),
      [class*="formula-bar"] > *:not(:last-child) {
        display: none !important;
      }
      /* Formula content area (last child) — full width, left-aligned */
      #cell-editing-box > *:last-child,
      .cell-editing-box > *:last-child,
      #formula-bar > *:last-child,
      .formula-bar > *:last-child,
      [id*="formula-bar"] > *:last-child,
      [class*="formula-bar"] > *:last-child,
      #ce-cell-content, .cell-editing-box-right, [class*="cell-content"],
      [id*="cell-content"] {
        font-family: -apple-system, 'SF Mono', 'Menlo', monospace !important;
        font-size: 13px !important;
        border: none !important;
        background: transparent !important;
        color: inherit !important;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        flex: 1 1 auto !important;
        width: 100% !important;
        min-width: 0 !important;
        min-height: 24px !important;
        white-space: nowrap !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        text-align: left !important;
        direction: ltr !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      /* Nested elements inside formula bar containers — force left align */
      #cell-editing-box > *:last-child *,
      .cell-editing-box > *:last-child *,
      #formula-bar > *:last-child *,
      .formula-bar > *:last-child *,
      #ce-cell-content * {
        text-align: left !important;
        direction: ltr !important;
      }
      `,

      // ── Bottom bar: sheet tabs + zoom — native mobile look ───────────────────
      // Target: "< >  + ≡  Dashboard  Sales Pipe  — 100% +" like the competitor.
      // OO renders this as a single bottom status row with: prev/next arrows,
      // add-sheet button, sheet-list button, scrollable tab strip, zoom controls.
      `
      /* ── Outer container ── */
      .sheet-tabs, .sheets-tabs, .tabs-navigation, #tabs-navigation,
      [class*="sheet-tabs"], [id*="sheet-tabs"], .tabs-main, #tabs-main,
      #id-tabs-panel, .tabbars, [id*="tabs-panel"] {
        font-family: -apple-system, 'SF Pro Text', sans-serif !important;
        font-size: 13px !important;
        border-top: 0.5px solid rgba(128,128,128,0.18) !important;
        background: transparent !important;
        height: 40px !important;
        min-height: 40px !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 2px !important;
        gap: 0 !important;
      }

      /* ── Prev / next sheet navigation arrows — hidden (not needed on mobile) ── */
      .btn-doc-back, .btn-doc-forward, .sheet-prev, .sheet-next,
      [class*="tabs-prev"], [class*="tabs-next"],
      [class*="tab-prev"], [class*="tab-next"],
      .tabbars .button:first-child, .tabbars .button:nth-child(2) {
        display: none !important;
      }

      /* ── Add sheet (+) and sheet-list (≡) buttons ─────────────────────────── */
      .btn-addTab, .tabs-add, .add-tab-btn, [class*="add-tab"],
      [class*="addTab"], #id-btn-add-sheet, .btn-list-sheet,
      [class*="list-sheet"], [class*="listSheet"] {
        width: 32px !important;
        height: 32px !important;
        min-width: 32px !important;
        border-radius: 8px !important;
        border: none !important;
        background: rgba(120,120,128,0.10) !important;
        font-size: 16px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        margin: 0 2px !important;
        color: inherit !important;
      }

      /* ── Individual sheet tabs ─────────────────────────────────────────────── */
      .sheet-tab, .tabs-item, .tab-item, [class*="sheet-tab"], [class*="tab-item"],
      [id*="sheet-tab"] {
        font-family: -apple-system, 'SF Pro Text', sans-serif !important;
        font-size: 13px !important;
        font-weight: 500 !important;
        letter-spacing: -0.1px !important;
        padding: 0 14px !important;
        height: 36px !important;
        min-height: 36px !important;
        border-radius: 0 !important;
        border: none !important;
        background: transparent !important;
        display: flex !important;
        align-items: center !important;
        white-space: nowrap !important;
        color: inherit !important;
        opacity: 0.65 !important;
      }

      /* ── Active sheet tab — bold + green indicator like Numbers ───────────── */
      .sheet-tab.active, .tabs-item.active, .tab-item.active,
      .sheet-tab.selected, .tabs-item.selected,
      [class*="sheet-tab"].active, [class*="tab-item"].active,
      [class*="sheet-tab"].selected {
        color: #30d158 !important;
        opacity: 1 !important;
        font-weight: 700 !important;
        border-bottom: 2.5px solid #30d158 !important;
        border-top: none !important;
        border-left: none !important;
        border-right: none !important;
        background: transparent !important;
      }

      /* ── Zoom controls — hidden from bottom bar; zoom moved to native toolbar ── */
      #id-toolbar-zoom, .toolbar-zoom,
      [id*="toolbar-zoom"], [class*="toolbar-zoom"],
      .btn-zoom-minus, .btn-zoom-plus,
      [class*="zoom-minus"], [class*="zoom-plus"],
      [class*="zoomMinus"], [class*="zoomPlus"],
      .zoom-value, [class*="zoom-value"], [id*="zoom-value"],
      [class*="zoomValue"], #id-zoom-value {
        display: none !important;
      }

      /* ── Bottom bar: hide everything except sheet tabs and add/list buttons ────
           OO's bottom bar has: [nav arrows] [add][list] [sheet tabs...] [save status] [filter mode] [zoom]
           We keep only: [add][list] [sheet tabs...]
           Nav arrows already hidden above. Hide status items and zoom panel. */

      /* Right-side info panel (save status + filter mode + zoom) */
      .toolbar-statusbar, #id-toolbar-statusbar,
      .spreadsheetAdditionalInfo, #id-spreadsheet-info,
      [class*="spreadsheetAdditional"], [id*="spreadsheet-info"],
      .spreadsheet-statusbar-right, .status-bar-right,
      [class*="statusbar-right"], [id*="statusbar-right"] {
        display: none !important;
      }

      /* "All changes saved" / doc save status */
      .cell-info-btn, #id-cell-info,
      .coediting-info, .coauthoring-info, [class*="coediting"],
      .doc-capacity, [class*="doc-capacity"],
      .saving, .saved, [class*="save-status"], [id*="save-status"],
      .doc-info, [id*="doc-info"],
      [class*="changes-saved"], [class*="all-changes"] {
        display: none !important;
      }

      /* "Filter mode" indicator button */
      .btn-doc-refilter, [id*="filter-btn"],
      [class*="filter-mode"], [id*="filter-mode"],
      [class*="refilter"], .tabs-filter-mode {
        display: none !important;
      }

      /* Zoom controls in bottom bar — belt + suspenders over the rule above */

          if (_clickOOBtn(['start presentation','presentation mode','slideshow','slide show','start slideshow','present','preview','демонстрация'])) return;
          var _prDoc = _innerWin && _innerWin.document;
          if (_prDoc) {
            try { _prDoc.dispatchEvent(new _innerWin.KeyboardEvent('keydown', {bubbles:true,cancelable:true,key:'F5',keyCode:116,which:116})); } catch(_) {}
          }
          return;
        }

        // ── Word page navigation commands ────────────────────────────────────────
        if (cmd === 'word-page-prev' || cmd === 'word-page-next' || cmd.indexOf('word-page-goto:') === 0) {
          var _wpTarget;
          if (cmd === 'word-page-prev')       _wpTarget = Math.max(1, _wordCurrentPage - 1);
          else if (cmd === 'word-page-next')  _wpTarget = Math.min(_wordTotalPages, _wordCurrentPage + 1);
          else                                _wpTarget = parseInt(cmd.slice(15), 10);
          if (isNaN(_wpTarget) || _wpTarget < 1) return;
          // Clamp to known range
          _wpTarget = Math.max(1, Math.min(_wordTotalPages || _wpTarget, _wpTarget));
          var _wped = _innerWin && _innerWin.Asc && _innerWin.Asc.editor;
          // 1) Try OO's goToPage (0-based) — confirmed present in word/sdk-all-min.js
          if (_wped && typeof _wped.goToPage === 'function') {
            try { _wped.goToPage(_wpTarget - 1); _wordCurrentPage = _wpTarget; _reportWordPagePos(); return; } catch(_) {}
          }
          // 2) DOM scroll via snap container: scroll to the nth .page offsetTop
          try {
            var _wpFr = document.querySelector('iframe[name="frameEditor"]');
            var _wpDoc = _wpFr && (_wpFr.contentDocument || (_wpFr.contentWindow && _wpFr.contentWindow.document));
            if (_wpDoc) {
              var _wpPages = _wpDoc.querySelectorAll('.page');
              var _wpEl = _wpPages[_wpTarget - 1];
              if (_wpEl) {
                var _wpScrollEl = _wpDoc.querySelector('#id_main_scroll') || _wpDoc.scrollingElement || _wpDoc.documentElement;
                if (_wpScrollEl) {
                  _wpScrollEl.scrollTo({top: _wpEl.offsetTop, behavior: 'smooth'});
                } else {
                  _wpEl.scrollIntoView({block: 'start', behavior: 'smooth'});
                }
                _wordCurrentPage = _wpTarget;
                setTimeout(_reportWordPagePos, 200);
                return;
              }
            }
          } catch(_) {}
          // 3) Keyboard fallback: Ctrl+PageDown / Ctrl+PageUp
          try {
            var _wpSteps = _wpTarget - _wordCurrentPage;
            if (_wpSteps !== 0) {
              var _wpKey = _wpSteps > 0 ? 'PageDown' : 'PageUp';
              var _wpCode = _wpSteps > 0 ? 34 : 33;
              var _wpInDoc = _innerWin && _innerWin.document;
              if (_wpInDoc) {
                for (var _wpi = 0; _wpi < Math.min(Math.abs(_wpSteps), 30); _wpi++) {
                  _wpInDoc.dispatchEvent(new KeyboardEvent('keydown', {
                    bubbles: true, cancelable: true, key: _wpKey, keyCode: _wpCode, which: _wpCode, ctrlKey: true, view: _innerWin
                  }));
                }
              }
            }
          } catch(_) {}
          setTimeout(_reportWordPagePos, 300);
          return;
        }

        // debug: dump Asc.editor API method names so we know what's available
        if (cmd === 'dump-api') {
          _dumpEditorAPI();
          return;
        }

        // debug: dump inner iframe DOM tree (id + class of all elements)
        if (cmd === 'dump-dom') {
          var iDoc = _innerWin.document;
          var lines = [];
          // Skip SVG sprite symbols (zero-size defs) — they fill first 200 slots
          // and hide actual layout elements. Show visible elements + key containers.
          iDoc.querySelectorAll('[id],[class]').forEach(function(el) {
            var tag = el.tagName.toLowerCase();
            if (tag === 'symbol' || tag === 'defs') return;
            var r = el.getBoundingClientRect();
            var vis = r.width > 0 && r.height > 0;
            var id = el.id ? '#' + el.id : '';
            var cls = el.className && typeof el.className === 'string'
              ? '.' + el.className.trim().split(/\s+/).join('.').slice(0, 60) : '';
            if (id || cls) lines.push((vis ? '+' : '-') + tag + id + cls);
          });
          // Report visible elements first (+ prefix), then invisible
          var vis = lines.filter(function(l) { return l[0] === '+'; });
          var invis = lines.filter(function(l) { return l[0] === '-'; });
          var out = ['DOM:vis='+vis.length+',invis='+invis.length]
            .concat(vis.slice(0, 120))
            .concat(['---INVIS---'])
            .concat(invis.slice(0, 60));
          console.log('[DOM-DUMP]\n' + out.join('\n'));
          window.webkit.messageHandlers.editorBridge.postMessage({ action: 'domDump', dump: out });
          return;
        }
      } catch(e) {
        console.warn('[iOS] execEditorCommand:', cmd, e);
      }
    };

    // Swift calls this to insert a photo picked from the native Photos picker.
    // officeURL is an "office://host/img/<uuid>" URL stored by OfficeSchemeHandler.
    //
    // Strategy: fetch image bytes in the OUTER frame (which can access office:// URLs via
    // OfficeSchemeHandler), create a same-origin blob URL in the INNER frame context, then
    // call OO's JS-layer insert APIs with that blob URL.
    //
    // Why NOT AddImageUrl([officeURL]) directly:
    //   AddImageUrl/ccf first calls srb(url); if falsy → routes through WASM HTTP client.
    //   WASM Web Worker cannot access WKURLSchemeHandler custom schemes (office://) →
    //   "Loading Image" overlay hangs forever.
    //
    // Fix: pre-register blobURL in AscCommon.Ew via y3a({key: blobURL}) so srb(blobURL)
    //   returns truthy → ccf skips the WASM fetcher → calls sUa([blobURL]) directly →
    //   yo.Efa preloads from blob: URL → yo.$D resolves → inline image inserted.
    window.insertImageByURL = function(officeURL) {
      if (!_innerWin) return;
      window._filterInterceptEnabled = false;
      try { _innerWin._ooInjectEnabled = false; } catch(_) {}

      var _imgRestoreDone = false;
      var _restore = function() {
        if (_imgRestoreDone) return; _imgRestoreDone = true;
        window._filterInterceptEnabled = true;
        try { _innerWin._ooInjectEnabled = true; } catch(_) {}
      };
      setTimeout(_restore, 10000);

      // Step 1: fetch image bytes in outer frame (office:// works here via WKURLSchemeHandler).
      fetch(officeURL)
        .then(function(r) {
          var ct = (r.headers && r.headers.get('content-type')) ||
                   (officeURL.slice(-4).toLowerCase() === '.png' ? 'image/png' : 'image/jpeg');
          return r.arrayBuffer().then(function(ab) { return { ab: ab, mime: ct }; });
        })
        .then(function(d) {
          // Step 2: create a same-origin blob URL inside the INNER frame context so OO's
          // JS image loader can fetch it without cross-frame restrictions.
          setTimeout(function() {
            try { _innerWin.focus(); } catch(_) {}
            var ed = _innerWin && _innerWin.Asc && _innerWin.Asc.editor;
            if (!ed) {
              try { if (window._showInsertToast) window._showInsertToast('Editor not ready — please try again'); } catch(_) {}
              _restore(); return;
            }
            try { localStorage.setItem('_oo_insert_pending', 'image'); } catch(_) {}

            var u8      = new (_innerWin.Uint8Array || Uint8Array)(d.ab);
            var BlobCls = _innerWin.Blob || Blob;
            var iURL    = _innerWin.URL  || URL;
            var blobURL = iURL.createObjectURL(new BlobCls([u8], { type: d.mime }));
            var ok = false;

            // Step 3: Pre-register blob URL in OO image cache so AddImageUrl skips WASM fetcher.
            // Word uses AscCommon.Ew.y3a; PPT/Excel use AscCommon.py.DWa — try both.
            // Direct py.M_e/py.urls assignment is the fallback in case DWa is mangled.
            try {
              var _cacheKey = 'media/iOSimg_' + Date.now();
              var _cacheMap = {};
              _cacheMap[_cacheKey] = blobURL;
              try { _innerWin.AscCommon.Ew.y3a(_cacheMap); } catch(_) {}
              try { _innerWin.AscCommon.py.DWa(_cacheMap); } catch(_) {}
              try {
                var _py = _innerWin.AscCommon.py;
                if (_py.M_e)   { _py.M_e[blobURL]    = _cacheKey; }
                if (_py.urls)  { _py.urls[_cacheKey]  = blobURL;  }
              } catch(_) {}
            } catch(_cacheErr) { console.warn('[iOS] image cache pre-reg:', _cacheErr); }

            if (!ok && typeof ed.AddImageUrl === 'function') {
              try { ed.AddImageUrl([blobURL]); ok = true; console.log('[iOS] insertImageByURL via AddImageUrl+cache'); }
              catch(e) { console.warn('[iOS] AddImageUrl:', e); }
            }
            // Excel-specific: asc_addImageDrawingObject takes an array
            if (!ok && typeof ed.asc_addImageDrawingObject === 'function') {
              try { ed.asc_addImageDrawingObject([blobURL]); ok = true; console.log('[iOS] insertImageByURL via asc_addImageDrawingObject'); }
              catch(e) { console.warn('[iOS] asc_addImageDrawingObject:', e); }
            }

            if (!ok) {
              console.warn('[iOS] insertImageByURL: no JS-layer API worked');
              try { if (window._showInsertToast) window._showInsertToast('Image insert not available — please try again'); } catch(_) {}
            }
            setTimeout(function() {
              try { iURL.revokeObjectURL(blobURL); } catch(_) {}
              try { localStorage.removeItem('_oo_insert_pending'); } catch(_) {}
              _restore();
            }, ok ? 5000 : 500);
          }, 100);
        })
        .catch(function(fetchErr) {
          console.warn('[iOS] insertImageByURL fetch failed:', fetchErr);
          try { if (window._showInsertToast) window._showInsertToast('Image insert not available — please try again'); } catch(_) {}
          try { localStorage.removeItem('_oo_insert_pending'); } catch(_) {}
          _restore();
        });
    };

    window.insertImageByDataURL = function(dataURL) {
      if (!_innerWin) return;
      window._filterInterceptEnabled = false;
      try { _innerWin._ooInjectEnabled = false; } catch(_) {}

      var _dUrlRestoreDone = false;
      var _dRestore = function() {
        if (_dUrlRestoreDone) return; _dUrlRestoreDone = true;
        window._filterInterceptEnabled = true;
        try { _innerWin._ooInjectEnabled = true; } catch(_) {}
      };
      setTimeout(_dRestore, 8000);

      setTimeout(function() {
        try { _innerWin.focus(); } catch(_) {}
        try {
          var ed = _innerWin && _innerWin.Asc && _innerWin.Asc.editor;
          if (!ed) {
            console.warn('[iOS] insertImageByDataURL: editor not ready');
            _dRestore(); return;
          }
          // Convert data URL → inner-frame blob URL.
          // asc_insertImageFromUrl only accepts http(s)/blob URLs, not data: URIs.
          // Create the blob in _innerWin context so OO's image loader (inner iframe)
          // can fetch it without cross-frame origin restrictions in WebKit.
          var imgURL = dataURL;
          try {
            var parts = dataURL.split(',');
            var mimeMatch = parts[0].match(/:(.*?);/);
            var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
            var bstr = atob(parts[1]);
            var n = bstr.length;
            var u8 = new (_innerWin.Uint8Array || Uint8Array)(n);
            while (n--) { u8[n] = bstr.charCodeAt(n); }
            var BlobCls = _innerWin.Blob || Blob;
            var iURL    = _innerWin.URL || URL;
            imgURL = iURL.createObjectURL(new BlobCls([u8], { type: mime }));
            console.log('[iOS] insertImageByDataURL: inner-frame blob URL created', imgURL.slice(0, 40));
          } catch(blobErr) {
            console.warn('[iOS] blob conversion failed, using data URL directly:', blobErr);
          }
          var _done = false;
          if (!_done && typeof ed.asc_insertImageFromUrl === 'function') {
            try { ed.asc_insertImageFromUrl(imgURL); _done = true; } catch(e1) { console.warn('[iOS] asc_insertImageFromUrl:', e1); }
          }
          if (!_done && typeof ed.asc_addImageUrl === 'function') {
            try { ed.asc_addImageUrl(imgURL); _done = true; } catch(e2) { console.warn('[iOS] asc_addImageUrl:', e2); }
          }
          if (!_done && typeof ed.asc_insertLocalImage === 'function') {
            try { ed.asc_insertLocalImage(imgURL); _done = true; } catch(e3) { console.warn('[iOS] asc_insertLocalImage:', e3); }
          }
          if (!_done && typeof ed.asc_AddImage === 'function') {
            try { ed.asc_AddImage(imgURL); _done = true; } catch(e4) { console.warn('[iOS] asc_AddImage:', e4); }
          }
          // Never fall back to _clickOOBtn: clicking OO's hidden toolbar insert-image
          // button opens OO's native file dialog which crashes the WKWebView process.
          if (!_done) {
            console.warn('[iOS] insertImageByDataURL: no working method found');
            try { if (window._showInsertToast) window._showInsertToast('Image insert not available — please try again'); } catch(_) {}
          }
        } catch(e) { console.warn('[iOS] insertImageByDataURL:', e); }
        setTimeout(_dRestore, 1500);
      }, 80);
    };

    // Swift calls this to send a file into the editor.
    // Accepts either `fileURL` (office:// URL — preferred, no base64 overhead) or
    // `base64data` (legacy fallback). `fileURL` path: fetch → ArrayBuffer, no encoding.
    window.receiveFileFromIOS = async function ({ fileName, fileType, fileURL, base64data }) {
      try {
        document.getElementById('loading-text').textContent = 'Opening ' + fileName + '…';
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('placeholder').style.display = 'none';
        scheduleLoadingHint();

        if (docEditor) {
          docEditor.destroyEditor?.();
          docEditor = null;
        }

        initServer();

        var buf;
        if (fileURL) {
          var resp = await fetch(fileURL);
          if (!resp.ok) throw new Error('Failed to fetch document: HTTP ' + resp.status);
          buf = await resp.arrayBuffer();
        } else {
          buf = base64ToArrayBuffer(base64data);
        }
        const file = new File([buf], fileName, { type: 'application/octet-stream' });
        await server.open(file, { fileType: fileType || fileName.split('.').pop() });

        loadEditor();
      } catch (err) {
        console.error('[editor] receiveFileFromIOS failed:', err);
        const errMsg = (err instanceof Error) ? err.message
          : (typeof err === 'string') ? err
          : (err && (err.errorDescription || err.message || JSON.stringify(err)))
          || 'Unknown error opening file';
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'openError',
          message: errMsg,
        });
      }
    };

    // Swift calls this to trigger a Save As (programmatic save)
    window.triggerSave = async function (fileType) {
      try {
        if (window.AscDesktopEditor?.executeFocusedCommand) {
          window.AscDesktopEditor.executeFocusedCommand('asc_onSave');
        } else {
          window.webkit.messageHandlers.editorBridge.postMessage({
            action: 'saveUnavailable',
            message: 'No programmatic save API',
          });
        }
      } catch (err) {
        console.error('[editor] triggerSave failed:', err);
      }
    };

    // Signal Swift that the module loaded and window.receiveFileFromIOS is defined.
    // Swift waits for this before calling receiveFileFromIOS.
    try {
      window.webkit.messageHandlers.editorBridge.postMessage({ action: 'scriptReady' });
    } catch (_) {}

  }()); // end async IIFE
  </script>
</body>
