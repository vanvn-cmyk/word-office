<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
  <title>Office Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #placeholder { width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #f0f0f0; z-index: 9999;
      gap: 16px; font-family: -apple-system, sans-serif; color: #666;
    }
    #loading-hint {
      font-size: 11px; color: #aaa; text-align: center; max-width: 240px;
      line-height: 1.5; opacity: 0; transition: opacity 0.6s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: #007AFF; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">Opening document…</span>
    <span id="loading-hint">First launch requires internet to load editor components</span>
  </div>
  <div id="placeholder" style="width:100%;height:100%;display:none"></div>

  <script>
  // Dynamic import avoids WKWebView limitations with static ES module imports
  // from custom URL scheme handlers. import() is a runtime call and works where
  // <script type="module"> static imports silently fail.
  (async function () {
    let sdkCore;
    try {
      sdkCore = await import('office://host/sdk-core/index.mjs');
    } catch (importErr) {
      const msg = 'Failed to load editor engine: ' + String(importErr);
      document.getElementById('loading-text').textContent = 'Editor engine failed to load.';
      try {
        window.webkit.messageHandlers.editorBridge.postMessage({ action: 'editorError', message: msg });
      } catch (_) {}
      return;
    }
    const { EditorServer, MockSocket, io, createXHRProxy, getDocumentType } = sdkCore;

    // ── Base64 → ArrayBuffer (chunked to avoid call-stack overflow) ────────────
    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // ── ArrayBuffer → Base64 (chunked to avoid call-stack overflow) ───────────
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const CHUNK = 32768;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.slice(i, i + CHUNK));
      }
      return btoa(binary);
    }

    // ── Intercept download anchor clicks to route to Swift bridge ─────────────
    // EditorServer calls a.click() with a blob: href when saving.
    // WKWebView can't download files, so we intercept and bridge to Swift.
    const pendingBlobCaptures = new Set();
    const _origRevoke = URL.revokeObjectURL.bind(URL);
    URL.revokeObjectURL = function (url) {
      if (!pendingBlobCaptures.has(url)) _origRevoke(url);
    };
    const _origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download && this.href.startsWith('blob:')) {
        const blobUrl = this.href;
        const filename = this.download;
        pendingBlobCaptures.add(blobUrl);
        fetch(blobUrl)
          .then(r => r.arrayBuffer())
          .then(buf => {
            pendingBlobCaptures.delete(blobUrl);
            _origRevoke(blobUrl);
            const b64 = arrayBufferToBase64(buf);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'save',
              fileName: filename,
              base64data: b64,
            });
          })
          .catch(err => {
            pendingBlobCaptures.delete(blobUrl);
            console.error('[editor] save intercept failed:', err);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'saveError',
              message: String(err),
            });
          });
        return; // do NOT call _origClick
      }
      return _origClick.call(this);
    };

    // ── State ──────────────────────────────────────────────────────────────────
    const X2T_PATH = 'office://host/x2t';
    const API_URL  = 'office://host/web-apps/apps/api/documents/api.js';
    const USER     = { id: 'local-user', name: 'User' };

    let server = null;
    let docEditor = null;
    let pendingFilePayload = null; // set by receiveFileFromIOS before editor loads
    let _innerWin = null;          // inner iframe contentWindow, saved in onAppReady()

    // Show the "requires internet" hint after 5 s if the editor hasn't become
    // ready yet — the CDN sdkjs download is what takes time on first launch.
    let hintTimer = null;
    function scheduleLoadingHint() {
      hintTimer = setTimeout(() => {
        const el = document.getElementById('loading-hint');
        if (el) el.style.opacity = '1';
      }, 5000);
    }
    function cancelLoadingHint() {
      clearTimeout(hintTimer);
      const el = document.getElementById('loading-hint');
      if (el) el.style.opacity = '0';
    }

    // ── Initialize EditorServer ────────────────────────────────────────────────
    function initServer() {
      server = new EditorServer({ x2tPath: X2T_PATH, user: USER });
      MockSocket.on('connect', ({ socket }) => server.handleConnect({ socket }));
      MockSocket.on('disconnect', ({ socket }) => server.handleDisconnect({ socket }));
    }

    // ── Create DocsAPI.DocEditor ───────────────────────────────────────────────
    function createEditor() {
      const doc = server.getDocument();
      const documentType = getDocumentType(doc.fileType);

      docEditor = new window.DocsAPI.DocEditor('placeholder', {
        isLocalFile: true,
        document: {
          fileType: doc.fileType,
          key: doc.key,
          title: doc.title,
          url: doc.url,
          permissions: {
            edit: doc.fileType !== 'pdf',
            chat: false,
            rename: false,
            review: false,
            print: true,
            copy: true,
            fillForms: false,
            modifyFilter: true,
            protect: true,
            download: false,
            rightMenu: false,
          },
        },
        documentType,
        editorConfig: {
          lang: navigator.language || 'en',
          coEditing: { mode: 'fast', change: false },
          user: { ...USER },
          customization: {
            uiTheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'theme-dark' : 'theme-light',
            features: { spellcheck: { change: false } },
            toolbar: { turnOffHeaderFooter: false },
            compactHeader: true,
            compactToolbar: true,   // collapse 2-row ribbon → single icon row
            toolbarHideFileName: true,
            close: { visible: false },
            about: false,
            chat: false,
            comments: false,
            hideRightMenu: true,
            featuresTips: false,
            macrosMode: 'disable',
          },
        },
        events: {
          onAppReady: onAppReady,
          onDocumentStateChange: (e) => {
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'documentStateChange',
              isDirty: e.data,
            });
          },
          onError: (e) => {
            console.error('[editor] error:', e);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'editorError',
              message: String(e.data),
            });
          },
          onSaveDocument: () => {
            window.webkit.messageHandlers.editorBridge.postMessage({ action: 'saved' });
          },
        },
        width: '100%',
        height: '100%',
      });
    }

    // CSS injected into the inner iframe (frameEditor) to strip ONLYOFFICE chrome.
    // Selectors verified against ONLYOFFICE v9.3.x app.css from CDN bundle.
    const OO_IOS_CSS = [
      // ── Header bar: ONLYOFFICE logo + File/Home/Insert tab row ───────────────
      // Hidden because the iOS nav bar (title + Done button) replaces it.
      '#header-row,#header-logo',
      '{display:none!important;height:0!important;min-height:0!important;overflow:hidden!important}',
      // ── Info / coauthors button (top-right in spreadsheet view) ─────────────
      '#id-btn-coauthors,#btn-coauthors,#btn-info,#id-btn-info,.btn-header-info,',
      '#id-spreadsheet-info,.icon-info-container,.asc-info-icon,.coauthors-btn,.btn-icon-info',
      '{display:none!important}',
      // ── Scrollbar chrome (not usable on touch; scrolling handled by WKWebView) ─
      '#ws-v-scrollbar,#ws-h-scrollbar,#ws-scrollbar-corner',
      '{display:none!important}',
      '::-webkit-scrollbar{width:0!important;height:0!important}',
      // ── Right-panel insert icon strip ────────────────────────────────────────
      // The vertical strip of icons on the right edge (Insert table/chart/shape/
      // image/¶/text) is replaced by the native iOS Insert tab in the toolbar.
      '#right-panel,#rightpanel,#right-menu,#rightmenu,',
      '#id-right-panel,#id-rightmenu,',
      '.right-panel,.rightpanel,.asc-rightmenu,',
      '[id*="right-panel"],[id*="rightpanel"],[id*="rightmenu"],',
      '[class*="right-panel"],[class*="rightpanel"]',
      '{display:none!important}',
      // NOTE: toolbar (#toolbar), formula bar (#cell-editing-box), left panel
      // (.left-panel), and status bar (#statusbar) are intentionally NOT hidden —
      // they provide essential editing features (formatting, cell input, sheet tabs).

      // ── AutoFilter / dialog panel — iOS-native feel ───────────────────────────
      // ONLYOFFICE renders its own filter dropdown and modal dialogs in HTML.
      // These rules restyle them with SF fonts, rounded corners, and iOS button colours.
      `
      /* iOS-native font everywhere in dialogs / filter panels */
      .asc-window, .asc-window *, .combo-dataview, .combo-dataview *,
      .filter-panel, .filter-panel *, .popup-menu, .popup-menu *,
      .dialog, .dialog * {
        font-family: -apple-system, 'SF Pro Text', sans-serif !important;
      }
      /* Dialog card — rounded corners, no browser chrome */
      .asc-window {
        border-radius: 14px !important;
        border: none !important;
        box-shadow: 0 4px 32px rgba(0,0,0,0.22) !important;
        overflow: hidden !important;
      }
      /* Dialog title bar */
      .asc-window > .header, .asc-window > .asc-window-header {
        background: transparent !important;
        border-bottom: 0.5px solid rgba(0,0,0,0.12) !important;
        font-size: 17px !important; font-weight: 600 !important;
        text-align: center !important; padding: 14px 16px 12px !important;
      }
      /* Hide yellow warning triangle icon — text conveys the message */
      .asc-window .header .icon, .asc-window .header img { display: none !important; }
      /* Dialog body */
      .asc-window > .body, .asc-window > .asc-window-body {
        padding: 12px 16px !important; font-size: 14px !important;
        color: #333 !important; text-align: center !important;
      }
      /* Dialog footer buttons — iOS UIAlertController style */
      .asc-window > .footer, .asc-window > .asc-window-footer {
        display: flex !important; flex-direction: row !important;
        padding: 0 !important;
        border-top: 0.5px solid rgba(0,0,0,0.12) !important;
      }
      .asc-window > .footer button, .asc-window > .asc-window-footer button {
        flex: 1 !important; border: none !important; border-radius: 0 !important;
        background: transparent !important; color: #007aff !important;
        font-size: 17px !important; padding: 12px !important;
        font-family: -apple-system, sans-serif !important;
      }
      .asc-window > .footer button.primary,
      .asc-window > .footer button.btn-type-ok {
        font-weight: 600 !important;
      }
      .asc-window > .footer button + button {
        border-left: 0.5px solid rgba(0,0,0,0.12) !important;
      }
      /* AutoFilter combo dropdown panel */
      .combo-dataview, .filter-panel {
        border-radius: 12px !important; border: none !important;
        box-shadow: 0 4px 24px rgba(0,0,0,0.18) !important;
        overflow: hidden !important;
      }
      /* Filter list rows */
      .combo-dataview .listview-item, .filter-panel .listview-item,
      .combo-dataview .item, .filter-panel .item {
        font-size: 14px !important; min-height: 44px !important;
        display: flex !important; align-items: center !important;
        border-bottom: 0.5px solid rgba(0,0,0,0.06) !important;
        padding: 0 16px !important;
      }
      /* Filter search input */
      .combo-dataview input[type=text], .filter-panel input[type=text] {
        border-radius: 10px !important; border: none !important;
        background: rgba(120,120,128,0.12) !important;
        padding: 7px 12px !important; font-size: 14px !important;
        margin: 8px !important; width: calc(100% - 16px) !important;
        box-sizing: border-box !important;
      }
      /* Filter OK/Cancel buttons */
      .combo-dataview .btn-type-ok, .combo-dataview .btn-ok,
      .filter-panel .btn-type-ok, .filter-panel .btn-ok {
        background: #007aff !important; color: white !important;
        border-radius: 10px !important; border: none !important;
        font-size: 15px !important; font-weight: 600 !important;
        min-height: 44px !important; padding: 0 20px !important;
      }
      .combo-dataview .btn-type-cancel, .combo-dataview .btn-cancel,
      .filter-panel .btn-type-cancel, .filter-panel .btn-cancel {
        background: rgba(120,120,128,0.12) !important; color: #007aff !important;
        border-radius: 10px !important; border: none !important;
        font-size: 15px !important; min-height: 44px !important; padding: 0 20px !important;
      }
      `,
    ].join('');

    // Elements to force-hide via inline style on first paint (belt-and-suspenders
    // for elements that carry an explicit style="display:block" attribute).
    const CHROME_SELECTORS = [
      '#header-row', '#header-logo',
    ];

    // Touch → mouse simulation for formula range selection.
    // When the user types '=SUM(' and then touch-drags on the sheet, ONLYOFFICE
    // needs to receive mousedown/mousemove/mouseup to insert a range ref (A1:A10).
    // When editing a formula (text starts with '='), WKWebView's pan/scroll gesture
    // steals touch events before ONLYOFFICE can use them to select a cell range.
    // Fix: call preventDefault() on touchstart/touchmove to suppress scroll.
    // WKWebView then lets touch-to-mouse conversion happen naturally, and ONLYOFFICE's
    // existing mouse handlers do the range selection.  We do NOT synthesise mouse events
    // manually — that caused double-dispatch conflicts.
    function injectFormulaTouchSelect(iDoc, innerWin) {
      var retries = 0;
      var attached = false;

      // Check whether the spreadsheet is currently in formula-edit mode.
      // Try the ONLYOFFICE API first, then fall back to DOM inspection.
      function isFormulaMode() {
        // --- ONLYOFFICE API path ---
        var ed = innerWin.Asc && innerWin.Asc.editor;
        if (ed) {
          // Some builds expose a direct "formula edit" flag
          if (typeof ed.asc_getIsFormulaEditMode === 'function') {
            return !!ed.asc_getIsFormulaEditMode();
          }
          // asc_getCellInfo reflects the current cell; formula starts with '='
          if (typeof ed.asc_getCellInfo === 'function') {
            try {
              var ci = ed.asc_getCellInfo();
              if (ci) {
                var f = typeof ci.asc_getFormula === 'function' ? ci.asc_getFormula() : null;
                if (typeof f === 'string' && f.trimStart().startsWith('=')) return true;
              }
            } catch(_) {}
          }
        }
        // --- DOM fallback: scan known formula-bar / inline-editor selectors ---
        var candidates = [
          '#cell-editing-box',
          '#ce-cell-content',
          '[id*="cell-edit"]',
          '[id*="formulaBar"]',
          '[id*="formula-bar"]',
          '.cell-editor-content',
          '.asc_editor'
        ];
        for (var i = 0; i < candidates.length; i++) {
          var el = iDoc.querySelector(candidates[i]);
          if (!el) continue;
          var txt = (typeof el.value === 'string' ? el.value : null)
                  || el.innerText || el.textContent || '';
          if (txt.trimStart().startsWith('=')) return true;
        }
        return false;
      }

      function trySetup() {
        if (attached) return;
        // Find the canvas that ONLYOFFICE renders spreadsheet cells onto
        var canvas = iDoc.querySelector('#ws-canvas-overlay')
          || iDoc.querySelector('#canvases canvas')
          || iDoc.querySelector('#id-main-view canvas')
          || iDoc.querySelector('.asc_CanvasScrollBody canvas')
          || iDoc.querySelector('#id-work-area canvas')
          || iDoc.querySelector('canvas');
        if (!canvas) {
          if (++retries < 20) { setTimeout(trySetup, 1000); }
          else { console.warn('[OO-touch] formula-select: canvas not found after retries'); }
          return;
        }
        attached = true;
        console.log('[OO-touch] formula-select attached on', canvas.id || canvas.tagName);

        // Prevent WKWebView scroll while in formula mode so ONLYOFFICE can select cells.
        // WKWebView automatically converts the non-scroll touch into mousedown/move/up
        // events that ONLYOFFICE's canvas handlers already understand.
        canvas.addEventListener('touchstart', function(e) {
          if (isFormulaMode()) e.preventDefault();
        }, { passive: false, capture: true });

        canvas.addEventListener('touchmove', function(e) {
          if (isFormulaMode()) e.preventDefault();
        }, { passive: false, capture: true });
      }

      // Start looking for the canvas 2 s after api.js injection; ONLYOFFICE needs time
      // to build its DOM but the canvas is usually ready well before 2 s.
      setTimeout(trySetup, 2000);
    }

    function injectIOSChrome(iDoc) {
      if (iDoc.getElementById('_oo_ios_hide')) return;

      // Suppress G.indexOf TypeError from ONLYOFFICE collaborative state machine.
      // This fires when insert/format operations touch the lock layer — the editor
      // handles the operation locally but the collab layer crashes on undefined refs.
      // Suppressing it allows the insert to complete visually without killing the editor.
      var _iWin = iDoc.defaultView;
      if (_iWin && !_iWin._ooErrPatched) {
        _iWin._ooErrPatched = true;
        var _prev = _iWin.onerror;
        _iWin.onerror = function(msg, src, line, col, err) {
          // After editor fully loaded: ALL errors are non-fatal feature errors.
          // Suppress here so the WKUserScript handler doesn't report them as fatal.
          if (_iWin._editorFullyLoaded) {
            console.warn('[OO] non-fatal post-load error:', msg, src + ':' + line);
            return true;
          }
          // Pre-load: suppress G.indexOf from collab state machine (getLock timing)
          if (typeof msg === 'string' && msg.indexOf('indexOf') !== -1) return true;
          return _prev ? _prev.apply(this, arguments) : false;
        };
        _iWin.addEventListener('unhandledrejection', function(ev) {
          if (_iWin._editorFullyLoaded) { ev.preventDefault(); return; }
          if (ev.reason && String(ev.reason).indexOf('indexOf') !== -1) ev.preventDefault();
        });
      }

      const s = iDoc.createElement('style');
      s.id = '_oo_ios_hide';
      s.textContent = OO_IOS_CSS;
      (iDoc.head || iDoc.documentElement).appendChild(s);

      function forceHide() {
        CHROME_SELECTORS.forEach(function(sel) {
          try { iDoc.querySelectorAll(sel).forEach(function(el) {
            if (el.style.display !== 'none') {
              el.style.setProperty('display', 'none', 'important');
            }
          }); } catch(_) {}
        });
      }

      // One-shot forceHide() handles elements that already exist with inline
      // display:block at injection time. CSS !important handles all future elements
      // ONLYOFFICE creates dynamically — no MutationObserver needed.
      // (A previous MutationObserver that dispatched resize on every mutation was
      // removed: it caused an infinite mutation→resize→layout→mutation loop during
      // spreadsheet rendering at ~89%, preventing the load from completing.)
      forceHide();

      // ── Geometry-based left sidebar hider ────────────────────────────────────
      // Run after ONLYOFFICE has finished rendering (4 s after injection).
      // Approach 1: keyword scan on id/class names.
      // Approach 2: geometric — hide any narrow left-anchored vertical strip.
      // Both write !important so they survive ONLYOFFICE's own style resets.
      setTimeout(function() {
        var keywords = ['leftmenu','left-menu','lefttoolbar','asc-leftmenu',
                        'plugin-panel','sidebar-btn','panel-left','panel-info','about-panel',
                        'left-panel','leftpanel','lft-panel','side-bar',
                        'rightmenu','right-menu','righttoolbar','asc-rightmenu',
                        'right-panel','rightpanel','rgt-panel','right-sidebar'];
        iDoc.querySelectorAll('*').forEach(function(el) {
          var id = (el.id || '').toLowerCase();
          var cls = (typeof el.className === 'string' ? el.className : '').toLowerCase();
          var str = id + ' ' + cls;
          for (var i = 0; i < keywords.length; i++) {
            if (str.indexOf(keywords[i]) !== -1) {
              el.style.setProperty('display', 'none', 'important');
              console.log('[OO-kw-hide]', el.tagName, el.id, el.className);
              break;
            }
          }
        });
        // Geometry: any narrow left-positioned full-height strip = left sidebar
        var winW = iDoc.documentElement.clientWidth || (iDoc.body && iDoc.body.clientWidth) || 375;
        var candidates = Array.from(
          iDoc.querySelectorAll('body > *, #app-container > *, .app-container > *')
        );
        candidates.forEach(function(el) {
          var r = el.getBoundingClientRect();
          if (r.width > 1 && r.width < 80 && r.left < 10 && r.height > 150) {
            el.style.setProperty('display', 'none', 'important');
            console.log('[OO-geo-hide-L]', el.tagName, '#' + el.id, el.className,
                        r.width + 'x' + r.height);
          }
          // Any narrow right-positioned full-height strip = right insert panel
          if (r.width > 1 && r.width < 80 && r.right > winW - 10 && r.height > 150) {
            el.style.setProperty('display', 'none', 'important');
            console.log('[OO-geo-hide-R]', el.tagName, '#' + el.id, el.className,
                        r.width + 'x' + r.height + ' right=' + Math.round(r.right));
          }
        });
        // Dump all visible IDs to help identify any remaining unknown selectors
        var ids = [];
        iDoc.querySelectorAll('[id]').forEach(function(el) {
          var r = el.getBoundingClientRect();
          if (r.width > 0 && r.height > 0)
            ids.push('#' + el.id + '[' + Math.round(r.width) + 'x' + Math.round(r.height) + ']');
        });
        console.log('[OO-inner-ids]', ids.join(' '));
      }, 4000);

      // ── Native filter interception + generic dialog styler ───────────────────
      // MutationObserver watches childList only (not attributes) — safe, no loop.
      (function() {
        function _sp(el, prop, val) { el.style.setProperty(prop, val, 'important'); }

        // ── Filter panel detection ─────────────────────────────────────────────
        // ONLYOFFICE uses custom UI (no <input type=checkbox>).
        // Detect by: text input + OK button + Cancel button pattern.
        function _isFilterPanel(node) {
          // Real checkboxes (some OO builds)
          if (node.querySelectorAll('input[type=checkbox]').length >= 2) return true;
          // Custom UI: must have a text/search input
          if (!node.querySelector('input[type=text], input:not([type])')) return false;
          var btns = Array.from(node.querySelectorAll('button'));
          var hasOK     = btns.some(function(b) { var t = b.textContent.trim().toLowerCase(); return t === 'ok' || t === 'apply'; });
          var hasCancel = btns.some(function(b) { return b.textContent.trim().toLowerCase() === 'cancel'; });
          return hasOK && hasCancel;
        }

        // Extract list rows from the filter panel.
        // Returns [{id, text, checked, el}] — el is the row element for later clicking.
        function _extractRows(panel) {
          // Real checkboxes path
          var cbs = Array.from(panel.querySelectorAll('input[type=checkbox]'));
          if (cbs.length > 0) {
            return cbs.map(function(cb, idx) {
              var row = cb.closest('li') || cb.closest('[role="option"]') || cb.parentElement;
              var text = '(blank)';
              if (row) {
                var tmp = row.cloneNode(true);
                tmp.querySelectorAll('input,button').forEach(function(e) { e.remove(); });
                text = tmp.textContent.trim().replace(/\s+\d+\s*$/, '').trim() || '(blank)';
              }
              return { id: idx, text: text, checked: cb.checked, el: cb };
            });
          }
          // Custom-UI path: find all leaf list items
          var candidates = Array.from(panel.querySelectorAll(
            'li, [role="option"], [role="listitem"], .listview-item, .list-item, .combo-item'
          )).filter(function(r) {
            // Keep only leaf nodes (no nested li/option inside)
            return r.querySelectorAll('li,[role="option"]').length === 0
              && r.textContent.trim().length > 0;
          });
          // Skip "Select all" row (first row or text contains "all")
          var dataRows = candidates.filter(function(r) {
            var t = r.textContent.trim().toLowerCase();
            return t !== 'select all' && !(t === 'all') && !r.classList.contains('all');
          });
          // If we only got 1 candidate it might be the "Select all" row itself — use all
          if (dataRows.length === 0) dataRows = candidates;
