<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
  <title>Office Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #placeholder { width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #f0f0f0; z-index: 9999;
      gap: 16px; font-family: -apple-system, sans-serif; color: #666;
    }
    #loading-hint {
      font-size: 11px; color: #aaa; text-align: center; max-width: 240px;
      line-height: 1.5; opacity: 0; transition: opacity 0.6s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: #007AFF; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">Opening document…</span>
    <span id="loading-hint">First launch requires internet to load editor components</span>
  </div>
  <div id="placeholder" style="width:100%;height:100%;display:none"></div>

  <script>
  // Dynamic import avoids WKWebView limitations with static ES module imports
  // from custom URL scheme handlers. import() is a runtime call and works where
  // <script type="module"> static imports silently fail.
  (async function () {
    let sdkCore;
    try {
      sdkCore = await import('office://host/sdk-core/index.mjs');
    } catch (importErr) {
      const msg = 'Failed to load editor engine: ' + String(importErr);
      document.getElementById('loading-text').textContent = 'Editor engine failed to load.';
      try {
        window.webkit.messageHandlers.editorBridge.postMessage({ action: 'editorError', message: msg });
      } catch (_) {}
      return;
    }
    const { EditorServer, MockSocket, io, createXHRProxy, getDocumentType } = sdkCore;

    // ── Base64 → ArrayBuffer (chunked to avoid call-stack overflow) ────────────
    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // ── ArrayBuffer → Base64 (chunked to avoid call-stack overflow) ───────────
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const CHUNK = 32768;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.slice(i, i + CHUNK));
      }
      return btoa(binary);
    }

    // ── Intercept download anchor clicks to route to Swift bridge ─────────────
    // EditorServer calls a.click() with a blob: href when saving.
    // WKWebView can't download files, so we intercept and bridge to Swift.
    const pendingBlobCaptures = new Set();
    const _origRevoke = URL.revokeObjectURL.bind(URL);
    URL.revokeObjectURL = function (url) {
      if (!pendingBlobCaptures.has(url)) _origRevoke(url);
    };
    const _origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download && this.href.startsWith('blob:')) {
        const blobUrl = this.href;
        const filename = this.download;
        pendingBlobCaptures.add(blobUrl);
        fetch(blobUrl)
          .then(r => r.arrayBuffer())
          .then(buf => {
            pendingBlobCaptures.delete(blobUrl);
            _origRevoke(blobUrl);
            const b64 = arrayBufferToBase64(buf);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'save',
              fileName: filename,
              base64data: b64,
            });
          })
          .catch(err => {
            pendingBlobCaptures.delete(blobUrl);
            console.error('[editor] save intercept failed:', err);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'saveError',
              message: String(err),
            });
          });
        return; // do NOT call _origClick
      }
      return _origClick.call(this);
    };

    // ── State ──────────────────────────────────────────────────────────────────
    const X2T_PATH = 'office://host/x2t';
    const API_URL  = 'office://host/web-apps/apps/api/documents/api.js';
    const USER     = { id: 'local-user', name: 'User' };

    let server = null;
    let docEditor = null;
    let pendingFilePayload = null; // set by receiveFileFromIOS before editor loads
    let _innerWin = null;          // inner iframe contentWindow, saved in onAppReady()

    // Show the "requires internet" hint after 5 s if the editor hasn't become
    // ready yet — the CDN sdkjs download is what takes time on first launch.
    let hintTimer = null;
    function scheduleLoadingHint() {
      hintTimer = setTimeout(() => {
        const el = document.getElementById('loading-hint');
        if (el) el.style.opacity = '1';
      }, 5000);
    }
    function cancelLoadingHint() {
      clearTimeout(hintTimer);
      const el = document.getElementById('loading-hint');
      if (el) el.style.opacity = '0';
    }

    // ── Initialize EditorServer ────────────────────────────────────────────────
    function initServer() {
      server = new EditorServer({ x2tPath: X2T_PATH, user: USER });
      MockSocket.on('connect', ({ socket }) => server.handleConnect({ socket }));
      MockSocket.on('disconnect', ({ socket }) => server.handleDisconnect({ socket }));
    }

    // ── Create DocsAPI.DocEditor ───────────────────────────────────────────────
    function createEditor() {
      const doc = server.getDocument();
      const documentType = getDocumentType(doc.fileType);

      docEditor = new window.DocsAPI.DocEditor('placeholder', {
        isLocalFile: true,
        document: {
          fileType: doc.fileType,
          key: doc.key,
          title: doc.title,
          url: doc.url,
          permissions: {
            edit: doc.fileType !== 'pdf',
            chat: false,
            rename: false,
            review: false,
            print: true,
            copy: true,
            fillForms: false,
            modifyFilter: true,
            protect: true,
            download: false,
            rightMenu: false,
          },
        },
        documentType,
        editorConfig: {
          lang: navigator.language || 'en',
          coEditing: { mode: 'fast', change: false },
          user: { ...USER },
          customization: {
            uiTheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'theme-dark' : 'theme-light',
            features: { spellcheck: { change: false } },
            toolbar: { turnOffHeaderFooter: false },
            compactHeader: true,
            compactToolbar: true,   // collapse 2-row ribbon → single icon row
            toolbarHideFileName: true,
            close: { visible: false },
            about: false,
            chat: false,
            comments: false,
            hideRightMenu: true,
            featuresTips: false,
            macrosMode: 'disable',
          },
        },
        events: {
          onAppReady: onAppReady,
          onDocumentStateChange: (e) => {
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'documentStateChange',
              isDirty: e.data,
            });
          },
          onError: (e) => {
            console.error('[editor] error:', e);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'editorError',
              message: String(e.data),
            });
          },
          onSaveDocument: () => {
            window.webkit.messageHandlers.editorBridge.postMessage({ action: 'saved' });
          },
        },
        width: '100%',
        height: '100%',
      });
    }

    // CSS injected into the inner iframe (frameEditor) to strip ONLYOFFICE chrome.
    // Selectors verified against ONLYOFFICE v9.3.x app.css from CDN bundle.
    const OO_IOS_CSS = [
      // ── Header bar: ONLYOFFICE logo + File/Home/Insert tab row ───────────────
      // Hidden because the iOS nav bar (title + Done button) replaces it.
      '#header-row,#header-logo',
      '{display:none!important;height:0!important;min-height:0!important;overflow:hidden!important}',
      // ── Scrollbar chrome (not usable on touch; scrolling handled by WKWebView) ─
      '#ws-v-scrollbar,#ws-h-scrollbar,#ws-scrollbar-corner',
      '{display:none!important}',
      '::-webkit-scrollbar{width:0!important;height:0!important}',
      // NOTE: toolbar (#toolbar), formula bar (#cell-editing-box), left panel
      // (.left-panel), and status bar (#statusbar) are intentionally NOT hidden —
      // they provide essential editing features (formatting, cell input, sheet tabs).
    ].join('');

    // Elements to force-hide via inline style on first paint (belt-and-suspenders
    // for elements that carry an explicit style="display:block" attribute).
    const CHROME_SELECTORS = [
      '#header-row', '#header-logo',
    ];

    function injectIOSChrome(iDoc) {
      if (iDoc.getElementById('_oo_ios_hide')) return;
      const s = iDoc.createElement('style');
      s.id = '_oo_ios_hide';
      s.textContent = OO_IOS_CSS;
      (iDoc.head || iDoc.documentElement).appendChild(s);

      function forceHide() {
        CHROME_SELECTORS.forEach(function(sel) {
          try { iDoc.querySelectorAll(sel).forEach(function(el) {
            if (el.style.display !== 'none') {
              el.style.setProperty('display', 'none', 'important');
            }
          }); } catch(_) {}
        });
      }

      // One-shot forceHide() handles elements that already exist with inline
      // display:block at injection time. CSS !important handles all future elements
      // ONLYOFFICE creates dynamically — no MutationObserver needed.
      // (A previous MutationObserver that dispatched resize on every mutation was
      // removed: it caused an infinite mutation→resize→layout→mutation loop during
      // spreadsheet rendering at ~89%, preventing the load from completing.)
      forceHide();
    }

    // ── onAppReady — patch inner iframe and inject api.js ─────────────────────
    function onAppReady() {
      cancelLoadingHint();
      const iframe = document.querySelector('iframe[name="frameEditor"]');
      if (!iframe) {
        console.error('[editor] frameEditor iframe not found');
        return;
      }
      const win = iframe.contentWindow;
      _innerWin = win;
      const iframeDoc = iframe.contentDocument;

      // Inject iOS chrome-hiding CSS BEFORE api.js so rules are present when
      // ONLYOFFICE creates its UI elements (avoids FOUC / flash of chrome).
      injectIOSChrome(iframeDoc);

      // Patch XHR in inner iframe so EditorServer can handle requests
      const XHR = createXHRProxy(win.XMLHttpRequest);
      const _Worker = win.Worker;

      XHR.use(req => server.handleRequest(req));

      Object.assign(win, {
        io,
        XMLHttpRequest: XHR,
        // Resolve relative worker URLs against our origin
        Worker: function (url, options) {
          return new _Worker(new URL(url, location.origin).href, options);
        },
      });

      // Also intercept download anchor in inner iframe
      const _iframeClick = win.HTMLAnchorElement.prototype.click;
      win.HTMLAnchorElement.prototype.click = function () {
        if (this.download && this.href.startsWith('blob:')) {
          // Delegate to outer frame interceptor (EditorServer runs in outer frame,
          // so this path shouldn't be hit, but keep as safety net)
          HTMLAnchorElement.prototype.click.call(this);
          return;
        }
        return _iframeClick.call(this);
      };

      // Inject api.js into inner iframe to start ONLYOFFICE loading
      const script = iframeDoc.createElement('script');
      script.src = new URL(API_URL, location.origin).href;
      iframeDoc.body.appendChild(script);

      // Show editor, hide loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';

      window.webkit.messageHandlers.editorBridge.postMessage({ action: 'ready' });
    }

    // ── Load api.js into outer frame, then create editor ──────────────────────
    function loadEditor() {
      if (window.DocsAPI?.DocEditor) { createEditor(); return; }
      let script = document.querySelector(`script[src="${API_URL}"]`);
      if (!script) {
        script = document.createElement('script');
        script.src = API_URL;
        document.head.appendChild(script);
      }
      script.onload = () => createEditor();
      script.onerror = () => {
        document.getElementById('loading-text').textContent = 'Failed to load editor.';
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'editorError',
          message: 'api.js load failed',
        });
      };
    }

    // ── Public API — called by Swift via callAsyncJavaScript ──────────────────

    // Swift calls this to execute a formatting command in the inner editor iframe.
    // Accepts: 'bold','italic','underline','strikeout','undo','redo',
    //          'align-left','align-center','align-right','align-justify',
    //          'list-bullet','list-numbered', 'style:<StyleName>'
    window.execEditorCommand = function(cmd) {
      if (!_innerWin) return;
      try {
        var MAP = {
          'undo': 'Undo', 'redo': 'Redo',
          'bold': 'Bold', 'italic': 'Italic',
          'underline': 'Underline', 'strikeout': 'Strikeout',
          'align-left': 'AlignLeft', 'align-center': 'AlignCenter',
          'align-right': 'AlignRight', 'align-justify': 'AlignJustify',
          'list-bullet': 'InsertBulletList', 'list-numbered': 'InsertNumberedList',
        };
        if (MAP[cmd]) {
          _innerWin.AscDesktopEditor?.executeFocusedCommand(MAP[cmd]);
          return;
        }
        if (cmd.startsWith('style:')) {
          _innerWin.AscDesktopEditor?.executeFocusedCommand('paragraph|' + cmd.slice(6));
        }
      } catch(e) {
        console.warn('[iOS] execEditorCommand:', cmd, e);
      }
    };

    // Swift calls this to send a file into the editor.
    window.receiveFileFromIOS = async function ({ fileName, fileType, base64data }) {
      try {
        document.getElementById('loading-text').textContent = 'Opening ' + fileName + '…';
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('placeholder').style.display = 'none';
        scheduleLoadingHint();

        if (docEditor) {
          docEditor.destroyEditor?.();
          docEditor = null;
        }

        initServer();

        const buf = base64ToArrayBuffer(base64data);
        const file = new File([buf], fileName, { type: 'application/octet-stream' });
        await server.open(file, { fileType: fileType || fileName.split('.').pop() });

        loadEditor();
      } catch (err) {
        console.error('[editor] receiveFileFromIOS failed:', err);
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'openError',
          message: String(err),
        });
      }
    };

    // Swift calls this to trigger a Save As (programmatic save)
    window.triggerSave = async function (fileType) {
      try {
        if (window.AscDesktopEditor?.executeFocusedCommand) {
          window.AscDesktopEditor.executeFocusedCommand('asc_onSave');
        } else {
          window.webkit.messageHandlers.editorBridge.postMessage({
            action: 'saveUnavailable',
            message: 'No programmatic save API',
          });
        }
      } catch (err) {
        console.error('[editor] triggerSave failed:', err);
      }
    };

    // Signal Swift that the module loaded and window.receiveFileFromIOS is defined.
    // Swift waits for this before calling receiveFileFromIOS.
    try {
      window.webkit.messageHandlers.editorBridge.postMessage({ action: 'scriptReady' });
    } catch (_) {}

  }()); // end async IIFE
  </script>
</body>
</html>
