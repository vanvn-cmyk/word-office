<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
  <title>Office Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #placeholder { width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #f0f0f0; z-index: 9999;
      gap: 16px; font-family: -apple-system, sans-serif; color: #666;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: #007AFF; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span id="loading-text">Opening document…</span>
  </div>
  <div id="placeholder" style="width:100%;height:100%;display:none"></div>

  <script type="module">
    // ── Imports from bundled wasm-onlyoffice-sdk core ──────────────────────────
    import {
      EditorServer,
      MockSocket,
      io,
      createXHRProxy,
      getDocumentType,
    } from 'office://host/sdk-core/index.mjs';

    // ── Base64 → ArrayBuffer (chunked to avoid call-stack overflow) ────────────
    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // ── ArrayBuffer → Base64 (chunked to avoid call-stack overflow) ───────────
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const CHUNK = 32768;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.slice(i, i + CHUNK));
      }
      return btoa(binary);
    }

    // ── Intercept download anchor clicks to route to Swift bridge ─────────────
    // EditorServer calls a.click() with a blob: href when saving.
    // WKWebView can't download files, so we intercept and bridge to Swift.
    const pendingBlobCaptures = new Set();
    const _origRevoke = URL.revokeObjectURL.bind(URL);
    URL.revokeObjectURL = function (url) {
      if (!pendingBlobCaptures.has(url)) _origRevoke(url);
    };
    const _origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.download && this.href.startsWith('blob:')) {
        const blobUrl = this.href;
        const filename = this.download;
        pendingBlobCaptures.add(blobUrl);
        fetch(blobUrl)
          .then(r => r.arrayBuffer())
          .then(buf => {
            pendingBlobCaptures.delete(blobUrl);
            _origRevoke(blobUrl);
            const b64 = arrayBufferToBase64(buf);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'save',
              fileName: filename,
              base64data: b64,
            });
          })
          .catch(err => {
            pendingBlobCaptures.delete(blobUrl);
            console.error('[editor] save intercept failed:', err);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'saveError',
              message: String(err),
            });
          });
        return; // do NOT call _origClick
      }
      return _origClick.call(this);
    };

    // ── State ──────────────────────────────────────────────────────────────────
    const X2T_PATH = 'office://host/x2t';
    const API_URL  = 'office://host/web-apps/apps/api/documents/api.js';
    const USER     = { id: 'local-user', name: 'User' };

    let server = null;
    let docEditor = null;
    let pendingFilePayload = null; // set by receiveFileFromIOS before editor loads

    // ── Initialize EditorServer ────────────────────────────────────────────────
    function initServer() {
      server = new EditorServer({ x2tPath: X2T_PATH, user: USER });
      MockSocket.on('connect', ({ socket }) => server.handleConnect({ socket }));
      MockSocket.on('disconnect', ({ socket }) => server.handleDisconnect({ socket }));
    }

    // ── Create DocsAPI.DocEditor ───────────────────────────────────────────────
    function createEditor() {
      const doc = server.getDocument();
      const documentType = getDocumentType(doc.fileType);

      docEditor = new window.DocsAPI.DocEditor('placeholder', {
        isLocalFile: true,
        document: {
          fileType: doc.fileType,
          key: doc.key,
          title: doc.title,
          url: doc.url,
          permissions: {
            edit: doc.fileType !== 'pdf',
            chat: false,
            rename: false,
            review: false,
            print: true,
            copy: true,
            fillForms: false,
            modifyFilter: true,
            protect: true,
            download: false, // prevent built-in download UI; we handle save ourselves
          },
        },
        documentType,
        editorConfig: {
          lang: navigator.language || 'en',
          coEditing: { mode: 'fast', change: false },
          user: { ...USER },
          customization: {
            uiTheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'theme-dark' : 'theme-light',
            features: { spellcheck: { change: false } },
            toolbar: { turnOffHeaderFooter: false },
          },
        },
        events: {
          onAppReady: onAppReady,
          onDocumentStateChange: (e) => {
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'documentStateChange',
              isDirty: e.data,
            });
          },
          onError: (e) => {
            console.error('[editor] error:', e);
            window.webkit.messageHandlers.editorBridge.postMessage({
              action: 'editorError',
              message: String(e.data),
            });
          },
          onSaveDocument: () => {
            window.webkit.messageHandlers.editorBridge.postMessage({ action: 'saved' });
          },
        },
        width: '100%',
        height: '100%',
      });
    }

    // ── onAppReady — patch inner iframe and inject api.js ─────────────────────
    function onAppReady() {
      const iframe = document.querySelector('iframe[name="frameEditor"]');
      if (!iframe) {
        console.error('[editor] frameEditor iframe not found');
        return;
      }
      const win = iframe.contentWindow;
      const iframeDoc = iframe.contentDocument;

      // Patch XHR in inner iframe so EditorServer can handle requests
      const XHR = createXHRProxy(win.XMLHttpRequest);
      const _Worker = win.Worker;

      XHR.use(req => server.handleRequest(req));

      Object.assign(win, {
        io,
        XMLHttpRequest: XHR,
        // Resolve relative worker URLs against our origin
        Worker: function (url, options) {
          return new _Worker(new URL(url, location.origin).href, options);
        },
      });

      // Also intercept download anchor in inner iframe
      const _iframeClick = win.HTMLAnchorElement.prototype.click;
      win.HTMLAnchorElement.prototype.click = function () {
        if (this.download && this.href.startsWith('blob:')) {
          // Delegate to outer frame interceptor (EditorServer runs in outer frame,
          // so this path shouldn't be hit, but keep as safety net)
          HTMLAnchorElement.prototype.click.call(this);
          return;
        }
        return _iframeClick.call(this);
      };

      // Inject api.js into inner iframe to start ONLYOFFICE loading
      const script = iframeDoc.createElement('script');
      script.src = new URL(API_URL, location.origin).href;
      iframeDoc.body.appendChild(script);

      // Show editor, hide loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';

      window.webkit.messageHandlers.editorBridge.postMessage({ action: 'ready' });
    }

    // ── Load api.js into outer frame, then create editor ──────────────────────
    function loadEditor() {
      if (window.DocsAPI?.DocEditor) { createEditor(); return; }
      let script = document.querySelector(`script[src="${API_URL}"]`);
      if (!script) {
        script = document.createElement('script');
        script.src = API_URL;
        document.head.appendChild(script);
      }
      script.onload = () => createEditor();
      script.onerror = () => {
        document.getElementById('loading-text').textContent = 'Failed to load editor.';
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'editorError',
          message: 'api.js load failed',
        });
      };
    }

    // ── Public API — called by Swift via callAsyncJavaScript ──────────────────

    // Swift calls this to send a file into the editor.
    window.receiveFileFromIOS = async function ({ fileName, fileType, base64data }) {
      try {
        document.getElementById('loading-text').textContent = 'Opening ' + fileName + '…';
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('placeholder').style.display = 'none';

        if (docEditor) {
          docEditor.destroyEditor?.();
          docEditor = null;
        }

        initServer();

        const buf = base64ToArrayBuffer(base64data);
        const file = new File([buf], fileName, { type: 'application/octet-stream' });
        await server.open(file, { fileType: fileType || fileName.split('.').pop() });

        loadEditor();
      } catch (err) {
        console.error('[editor] receiveFileFromIOS failed:', err);
        window.webkit.messageHandlers.editorBridge.postMessage({
          action: 'openError',
          message: String(err),
        });
      }
    };

    // Swift calls this to trigger a Save As (programmatic save)
    window.triggerSave = async function (fileType) {
      try {
        if (window.AscDesktopEditor?.executeFocusedCommand) {
          window.AscDesktopEditor.executeFocusedCommand('asc_onSave');
        } else {
          window.webkit.messageHandlers.editorBridge.postMessage({
            action: 'saveUnavailable',
            message: 'No programmatic save API',
          });
        }
      } catch (err) {
        console.error('[editor] triggerSave failed:', err);
      }
    };
  </script>
</body>
</html>
